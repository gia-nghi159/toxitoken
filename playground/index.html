<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toxitoken Playground</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
            height: 100vh;
            box-sizing: border-box;
        }

        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .sidebar {
            flex: 0 0 350px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .green-theme h2 {
            color: var(--accent-green);
        }

        .red-theme h2 {
            color: var(--accent-red);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="password"],
        input[type="number"] {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
        }

        input:focus {
            outline: none;
            border-color: var(--text-muted);
        }

        .green-theme input:focus {
            border-color: var(--accent-green);
        }

        .red-theme input:focus {
            border-color: var(--accent-red);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            opacity: 0.8;
        }

        .btn-send {
            background: linear-gradient(135deg, var(--accent-red), var(--accent-green));
            color: white;
            margin-top: 10px;
        }

        #chat-output {
            flex: 1;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            font-family: monospace;
            white-space: pre-wrap;
            overflow-y: auto;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .user-msg {
            color: var(--accent-green);
            margin-bottom: 10px;
        }

        .bot-msg {
            color: var(--text-main);
            margin-bottom: 20px;
        }

        #prompt-input {
            width: 100%;
            height: 80px;
            resize: none;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 15px;
            border-radius: 8px;
            font-family: inherit;
            box-sizing: border-box;
        }

        #prompt-input:focus {
            outline: none;
            border-color: var(--accent-green);
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <!-- Settings Panel -->
        <div class="panel green-theme">
            <h2>BYOK Settings</h2>

            <div class="form-group">
                <label>Gateway URL</label>
                <input type="text" id="cfg-url" value="https://toxitoken.onrender.com">
            </div>

            <div class="form-group">
                <label>Model</label>
                <input type="text" id="cfg-model" value="gemini-3.5-flash">
            </div>

            <div class="form-group">
                <label>API Key (Bearer Token)</label>
                <input type="password" id="cfg-token" placeholder="sk-...">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="cfg-mock">
                <label for="cfg-mock">Enable Mock Mode</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="cfg-nocache">
                <label for="cfg-nocache">Bypass Semantic Cache</label>
            </div>
        </div>

        <!-- Chaos Engine Panel -->
        <div class="panel red-theme">
            <h2>Chaos Engine</h2>

            <div class="form-group">
                <label>Rate (0.0 - 1.0)</label>
                <input type="number" id="chaos-rate" value="1.0" step="0.1" min="0" max="1">
            </div>

            <div class="form-group">
                <label>Delay (e.g., 500ms, 2s)</label>
                <input type="text" id="chaos-delay" placeholder="Empty = none">
            </div>

            <div class="form-group">
                <label>Status Code (e.g., 504)</label>
                <input type="number" id="chaos-status" placeholder="Empty = none">
            </div>

            <div class="form-group">
                <label>Drop After (Tokens)</label>
                <input type="number" id="chaos-drop" placeholder="Empty = none">
            </div>

            <div class="form-group">
                <label>Drip Delay (ms)</label>
                <input type="number" id="chaos-drip" placeholder="Empty = none">
            </div>

            <div class="form-group">
                <label>Lose Chunk Prob (0.0 - 1.0)</label>
                <input type="number" id="chaos-lose" placeholder="Empty = none" step="0.01">
            </div>

            <div class="form-group">
                <label>Inject Fuzz (Text)</label>
                <input type="text" id="chaos-inject" placeholder="Empty = none">
            </div>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area panel">
        <div id="chat-output"></div>

        <div style="display:flex; flex-direction:column;">
            <textarea id="prompt-input" placeholder="Type a prompt to test the Toxitoken gateway..."></textarea>
            <button class="btn-send" onclick="sendRequest()">Send Stream</button>
        </div>
    </div>

    <script>
        document.getElementById('prompt-input').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendRequest();
            }
        });

        function buildChaosConfig() {
            const parts = [];

            const rate = document.getElementById('chaos-rate').value;
            if (rate && rate !== "1.0") parts.push(`rate=${rate}`);

            const delay = document.getElementById('chaos-delay').value;
            if (delay) parts.push(`delay=${delay}`);

            const status = document.getElementById('chaos-status').value;
            if (status) parts.push(`status=${status}`);

            const drop = document.getElementById('chaos-drop').value;
            if (drop) parts.push(`drop_after=${drop}`);

            const drip = document.getElementById('chaos-drip').value;
            if (drip) parts.push(`drip=${drip}`);

            const lose = document.getElementById('chaos-lose').value;
            if (lose) parts.push(`lose_chunk=${lose}`);

            const inject = document.getElementById('chaos-inject').value;
            if (inject) parts.push(`inject=${inject}`);

            return parts.join(',');
        }

        async function sendRequest() {
            const output = document.getElementById('chat-output');
            const prompt = document.getElementById('prompt-input').value.trim();
            if (!prompt) return;

            // Clear input and append user message to output
            document.getElementById('prompt-input').value = '';
            output.innerHTML += `<div class="user-msg">> ${prompt}</div><div class="bot-msg" id="current-bot"></div>`;
            const botMsgDiv = document.getElementById('current-bot');

            // Read configurations
            const url = document.getElementById('cfg-url').value.replace(/\/$/, '') + '/v1/chat/completions';
            const model = document.getElementById('cfg-model').value.trim() || 'gpt-4o-mini';
            const token = document.getElementById('cfg-token').value.trim();
            const isMock = document.getElementById('cfg-mock').checked;
            const noCache = document.getElementById('cfg-nocache').checked;
            const chaosConfig = buildChaosConfig();

            // Prepare headers
            const headers = {
                "Content-Type": "application/json"
            };
            if (token) headers["Authorization"] = `Bearer ${token}`;
            if (isMock) headers["X-Proxy-Mode"] = "mock";
            if (chaosConfig) headers["X-Chaos-Config"] = chaosConfig;
            if (noCache) headers["Cache-Control"] = "no-cache";

            const body = JSON.stringify({
                model: model,
                stream: true,
                messages: [{ role: "user", content: prompt }]
            });

            try {
                const response = await fetch(url, { method: "POST", headers, body });

                if (!response.ok) {
                    const errText = await response.text();
                    botMsgDiv.innerHTML = `<span style="color:var(--accent-red)">HTTP ${response.status} Error: ${errText}</span>`;
                    botMsgDiv.removeAttribute("id");
                    return;
                }

                // Parse SSE Stream
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let done = false;
                let buffer = "";
                let receivedDone = false;

                while (!done) {
                    const { value, done: readerDone } = await reader.read();
                    done = readerDone;
                    if (value) {
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop(); // Keep the last incomplete line in the buffer

                        for (let line of lines) {
                            line = line.trim();
                            if (line.startsWith('data: ')) {
                                const payload = line.replace('data: ', '');
                                if (payload === '[DONE]') {
                                    receivedDone = true;
                                    break;
                                }

                                try {
                                    const parsed = JSON.parse(payload);
                                    if (parsed.choices && parsed.choices.length > 0) {
                                        const content = parsed.choices[0].delta.content || "";
                                        // Replace newlines with <br> for HTML rendering
                                        botMsgDiv.innerHTML += content.replace(/\n/g, '<br>');
                                        // Auto-scroll to bottom
                                        output.scrollTop = output.scrollHeight;
                                    }
                                } catch (e) {
                                    // Simulated lose_chunk might result in malformed JSON here
                                    console.warn("JSON Parse Error (simulated drop?):", e, payload);
                                    botMsgDiv.innerHTML += `<span style="color:var(--accent-red)"> [ERR: Malformed JSON Chunk] </span>`;
                                }
                            }
                        }
                    }
                }

                if (!receivedDone) {
                    botMsgDiv.innerHTML += `<br><br><span style="color:var(--accent-red)">Network Error (Simulated Drop?): Connection closed prematurely without [DONE]</span>`;
                }

                botMsgDiv.removeAttribute("id");

            } catch (err) {
                botMsgDiv.innerHTML = `<span style="color:var(--accent-red)">Network Error (Simulated Drop?): ${err.message}</span>`;
                botMsgDiv.removeAttribute("id");
            }
        }
    </script>
</body>

</html>
